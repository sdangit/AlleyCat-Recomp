name: macOS port validation

on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.ref }}
  cancel-in-progress: true

# Runner architecture labels checked against GitHub's hosted-runner reference:
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# This workflow never downloads CAT.EXE or uploads build directories/artifacts.
jobs:
  macos-release:
    runs-on: macos-15 # ARM64, not the separately named macos-15-intel image
    timeout-minutes: 25
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Build and inspect asset-free application and archive
        run: |
          test "$(uname -m)" = arm64
          python tools/validate_macos.py --configure --build build/ci-macos \
            --source-revision "$SOURCE_REVISION" --report build/validation.json \
            --jobs 3 --cmake-arg=-DCMAKE_OSX_ARCHITECTURES=arm64 \
            --cmake-arg=-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            --app build/ci-macos/AlleyCat.app --package-output build/ci-package

  windows-release:
    runs-on: windows-2025 # x64
    timeout-minutes: 25
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Download and verify official LLVM-MinGW
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-x86_64.zip' -OutFile $archive
          $expected = '4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'LLVM-MinGW archive hash mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          $toolchain = Join-Path $env:RUNNER_TEMP 'llvm-mingw-20261117-ucrt-x86_64'
          "LLVM_MINGW=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $toolchain 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and check asset-free Windows release
        shell: pwsh
        run: |
          $compiler = Join-Path $env:LLVM_MINGW 'bin/x86_64-w64-mingw32-clang.exe'
          python tools/validate_macos.py --platform windows --configure --build build/ci-windows `
            --source-revision $env:SOURCE_REVISION --report build/validation.json --jobs 4 `
            --cmake-arg=-G --cmake-arg=Ninja "--cmake-arg=-DCMAKE_C_COMPILER=$compiler"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
